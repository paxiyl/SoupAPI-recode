// SoupAPI — Minecraft 1.8.9 / Minecraft Forge
//
// ForgeGradle 2.1 is the last version that supports 1.8.9 (2.3 requires 1.12+), and it in turn
// requires Gradle 2.x and a Java 8 JDK. The wrapper is pinned to Gradle 2.14.1 accordingly.
buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.maven.apache.org/maven2" }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '2.1-SNAPSHOT', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.3.7-a-1.8.9"
group = "me.Padej_"
archivesBaseName = "SoupAPI"

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    // MCP "stable_20" is the 1.8.9 stable mapping set.
    mappings = "stable_20"
}

repositories {
    maven { url = "https://maven.minecraftforge.net" }
}

dependencies {
    // JNA, used only by the Discord Rich Presence integration. Shaded in because Forge does not
    // provide it. RPC is hard-disabled on Android/PojavLauncher, which has no native discord-rpc
    // build — see modules/RPC.java.
    compile 'net.java.dev.jna:jna:4.5.2'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Shade JNA into the mod jar so it is a single-file install.
jar {
    from {
        configurations.compile
                .findAll { it.name.startsWith('jna') }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**'

    manifest {
        attributes 'FMLCorePluginContainsFMLMod': 'false'
    }
}

// Developer helper: dump the compile classpath so individual files can be type-checked with
// plain javac during the port, instead of paying for a full ForgeGradle build each time.
task dumpCompileClasspath << {
    def f = file("$buildDir/compile-classpath.txt")
    f.parentFile.mkdirs()
    f.text = sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
    println "wrote ${f}"
}
