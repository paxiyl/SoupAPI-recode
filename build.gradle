plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Legacy Fabric'
        url = 'https://repo.legacyfabric.net/repository/legacyfabric/'
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // Minecraft 1.8.9 with Legacy Fabric yarn mappings.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.legacyfabric:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // NOTE: Legacy Fabric API is deliberately NOT a dependency.
    //
    // The 1.21.4 sources used fabric-api for ClientTickEvents, WorldRenderEvents,
    // HudRenderCallback and ParticleFactoryRegistry. Legacy Fabric API either does
    // not ship those modules for 1.8.9 or ships them with different semantics, so
    // the port drives all of them from its own mixin-backed event bus
    // (me.Padej_.soupapi.event.SoupEvents). That keeps the mod a single-file install,
    // which matters a lot on PojavLauncher where every extra mod is another thing to
    // sideload and another source of version skew.

    // JNA, only used by the Discord Rich Presence integration. Bundled via jar-in-jar
    // because Legacy Fabric does not provide it. Discord RPC is hard-disabled on
    // Android/PojavLauncher (no native discord-rpc build exists for it), see RPC.java.
    include(implementation("net.java.dev.jna:jna:${project.jna_version}"))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = Integer.parseInt(project.target_java_version)

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // Emit Java 8 class files: PojavLauncher runs 1.8.9 on a Java 8 runtime.
    it.options.release.set(targetJavaVersion)
    // The bootclasspath for --release 8 is synthesised by javac, so no JDK 8 is needed,
    // but javac still warns about it. Keep the log readable.
    it.options.compilerArgs << "-Xlint:-options"
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}

// Developer helper: dump the compile classpath so individual files can be type-checked
// with plain javac during the port, without paying for a full Gradle build each time.
tasks.register('dumpCompileClasspath') {
    doLast {
        def f = file("$buildDir/compile-classpath.txt")
        f.parentFile.mkdirs()
        f.text = sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
        println "wrote ${f}"
    }
}
